<svg xmlns="http://www.w3.org/2000/svg" width="220.00" height="108" viewBox="0 0 220.00 108"><defs><style>@font-face{font-family:'Instrument Serif';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Geist Mono';font-weight:400;src:url(data:font/woff;base64,) format('woff')}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translate(4px,-4px)}}
@keyframes tilein{0%{opacity:0;transform:translateY(90px) scale(.6) rotate(-9deg)}55%{opacity:1;transform:translateY(-10px) scale(1.05) rotate(2deg)}75%{transform:translateY(3px) scale(.98) rotate(-.8deg)}100%{opacity:1;transform:none}}
@keyframes sheen{0%{transform:translateX(-300px) skewX(-20deg)}22%,100%{transform:translateX(460px) skewX(-20deg)}}
@keyframes ring{0%{opacity:.7;transform:scale(.2)}100%{opacity:0;transform:scale(2.6)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.r{opacity:0;transform-box:fill-box;animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.f{opacity:0;animation:fade .5s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out both}
.live{animation:pulse 1.6s ease-in-out infinite}
.cur{animation:blink 1s steps(1) infinite}
.nu{transform-box:fill-box;animation:nudge 1.8s ease-in-out infinite}
.ti{opacity:0;transform-box:fill-box;transform-origin:50% 60%;animation:tilein .9s cubic-bezier(.2,.8,.2,1) both}
.sh{animation:sheen 5s ease-in-out infinite}
.rg{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 1s ease-out both}
.dr{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 1.4s ease-out both}
.ty{animation:reveal .7s steps(26) both}
.wp{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:wipe .6s steps(18) both}
@media (prefers-reduced-motion: reduce){.r,.f,.g,.p,.live,.cur,.nu,.ti,.rg,.dr,.wp,.ty{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important;clip-path:none!important}.sh,.rg{display:none}}
</style></defs><g transform="translate(6 0)"><rect x="0.5" y="0.5" width="207.0" height="95" rx="22" fill="#f4f1ea" stroke="#d9d4c7" /><g class="p" style="animation-delay:0.34s"><circle cx="40" cy="48" r="24" fill="#E4405F"/><svg x="28.0" y="36.0" width="24" height="24" viewBox="0 0 24 24"><path d="M12 0C8.74 0 8.333.015 7.053.072 5.775.132 4.905.333 4.14.63c-.789.306-1.459.717-2.126 1.384S.935 3.35.63 4.14C.333 4.905.131 5.775.072 7.053.012 8.333 0 8.74 0 12s.015 3.667.072 4.947c.06 1.277.261 2.148.558 2.913.306.788.717 1.459 1.384 2.126.667.666 1.336 1.079 2.126 1.384.766.296 1.636.499 2.913.558C8.333 23.988 8.74 24 12 24s3.667-.015 4.947-.072c1.277-.06 2.148-.262 2.913-.558.788-.306 1.459-.718 2.126-1.384.666-.667 1.079-1.335 1.384-2.126.296-.765.499-1.636.558-2.913.06-1.28.072-1.687.072-4.947s-.015-3.667-.072-4.947c-.06-1.277-.262-2.149-.558-2.913-.306-.789-.718-1.459-1.384-2.126C21.319 1.347 20.651.935 19.86.63c-.765-.297-1.636-.499-2.913-.558C15.667.012 15.26 0 12 0zm0 2.16c3.203 0 3.585.016 4.85.071 1.17.055 1.805.249 2.227.415.562.217.96.477 1.382.896.419.42.679.819.896 1.381.164.422.36 1.057.413 2.227.057 1.266.07 1.646.07 4.85s-.015 3.585-.074 4.85c-.061 1.17-.256 1.805-.421 2.227-.224.562-.479.96-.899 1.382-.419.419-.824.679-1.38.896-.42.164-1.065.36-2.235.413-1.274.057-1.649.07-4.859.07-3.211 0-3.586-.015-4.859-.074-1.171-.061-1.816-.256-2.236-.421-.569-.224-.96-.479-1.379-.899-.421-.419-.69-.824-.9-1.38-.165-.42-.359-1.065-.42-2.235-.045-1.26-.061-1.649-.061-4.844 0-3.196.016-3.586.061-4.861.061-1.17.255-1.814.42-2.234.21-.57.479-.96.9-1.381.419-.419.81-.689 1.379-.898.42-.166 1.051-.361 2.221-.421 1.275-.045 1.65-.06 4.859-.06l.045.03zm0 3.678c-3.405 0-6.162 2.76-6.162 6.162 0 3.405 2.76 6.162 6.162 6.162 3.405 0 6.162-2.76 6.162-6.162 0-3.405-2.76-6.162-6.162-6.162zM12 16c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm7.846-10.405c0 .795-.646 1.44-1.44 1.44-.795 0-1.44-.646-1.44-1.44 0-.794.646-1.439 1.44-1.439.793-.001 1.44.645 1.44 1.439z" fill="#ffffff"/></svg></g><text x="76" y="50" font-family="'Instrument Serif', Georgia, serif" font-size="25" fill="#15151a" text-anchor="start" class="r" style="animation-delay:0.44s" >Instagram</text><text x="76" y="70" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#7a7a84" text-anchor="start" class="f" style="animation-delay:0.59s" >@thestoryteller.raw</text><g class="nu" style="animation-delay:0.33999999999999997s"><path d="M174.0 34 L186.0 22 M177.0 22 H186.0 V31" fill="none" stroke="#15151a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>