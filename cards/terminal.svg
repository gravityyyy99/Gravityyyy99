<svg xmlns="http://www.w3.org/2000/svg" width="880.00" height="440" viewBox="0 0 880.00 440"><defs><style>@font-face{font-family:'Geist Mono';font-weight:400;src:url(data:font/woff;base64,) format('woff')}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translate(4px,-4px)}}
@keyframes tilein{0%{opacity:0;transform:translateY(90px) scale(.6) rotate(-9deg)}55%{opacity:1;transform:translateY(-10px) scale(1.05) rotate(2deg)}75%{transform:translateY(3px) scale(.98) rotate(-.8deg)}100%{opacity:1;transform:none}}
@keyframes sheen{0%{transform:translateX(-300px) skewX(-20deg)}22%,100%{transform:translateX(460px) skewX(-20deg)}}
@keyframes ring{0%{opacity:.7;transform:scale(.2)}100%{opacity:0;transform:scale(2.6)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.r{opacity:0;transform-box:fill-box;animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.f{opacity:0;animation:fade .5s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out both}
.live{animation:pulse 1.6s ease-in-out infinite}
.cur{animation:blink 1s steps(1) infinite}
.nu{transform-box:fill-box;animation:nudge 1.8s ease-in-out infinite}
.ti{opacity:0;transform-box:fill-box;transform-origin:50% 60%;animation:tilein 1.1s cubic-bezier(.2,.8,.2,1) both}
.sh{animation:sheen 5s ease-in-out infinite}
.rg{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 1s ease-out both}
.dr{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 1.4s ease-out both}
.ty{animation:reveal .7s steps(26) both}
.wp{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:wipe .6s steps(18) both}
@media (prefers-reduced-motion: reduce){.r,.f,.g,.p,.live,.cur,.nu,.ti,.rg,.dr,.wp,.ty{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important;clip-path:none!important}.sh,.rg{display:none}}
</style></defs><g transform="translate(0 0)"><rect x="0.5" y="0.5" width="879" height="427" rx="18" fill="#0f1115" stroke="#2a2f3a" /><rect x="0.5" y="0.5" width="879" height="40" rx="18" fill="#171a21"/><rect x="0.5" y="24" width="879" height="17" fill="#171a21"/><circle cx="28" cy="21" r="6" fill="#ff5f56" class="p" style="animation-delay:0.0s"/><circle cx="48" cy="21" r="6" fill="#ffbd2e" class="p" style="animation-delay:0.1s"/><circle cx="68" cy="21" r="6" fill="#27c93f" class="p" style="animation-delay:0.2s"/><text x="440.0" y="25" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#7d8590" text-anchor="middle" >dibya@portfolio: ~/about.js</text><text x="28" y="62" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:0.50s"><tspan fill="#7ee787">~/dibya</tspan><tspan fill="#7d8590"> $ </tspan><tspan fill="#e6edf3">whoami</tspan></text><text x="28" y="83" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:0.82s"><tspan fill="#e6edf3">&gt; Dibyajyoti Pradhan</tspan><tspan fill="#7d8590">   // aka Dibya, aka gravityyyy99</tspan></text><text x="28" y="104" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:1.14s"><tspan fill="#7ee787">~/dibya</tspan><tspan fill="#7d8590"> $ </tspan><tspan fill="#e6edf3">cat about.js</tspan></text><text x="28" y="125" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:1.46s"><tspan fill="#ff7b72">class </tspan><tspan fill="#ffa657">Dibya </tspan><tspan fill="#ff7b72">extends </tspan><tspan fill="#ffa657">Engineer </tspan><tspan fill="#e6edf3">{</tspan></text><text x="28" y="146" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:1.78s"><tspan fill="#d2a8ff">  stack </tspan><tspan fill="#e6edf3">= [</tspan><tspan fill="#a5d6ff">&#x27;React&#x27;</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a5d6ff">&#x27;MongoDB&#x27;</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a5d6ff">&#x27;SQL&#x27;</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a5d6ff">&#x27;Firebase&#x27;</tspan><tspan fill="#e6edf3">];</tspan></text><text x="28" y="167" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:2.10s"><tspan fill="#d2a8ff">  bugs </tspan><tspan fill="#e6edf3">= [];  </tspan><tspan fill="#7d8590">// O(n) in the morning, O(n log n) after coffee</tspan></text><text x="28" y="188" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:2.42s"><tspan fill="#ff7b72">  async </tspan><tspan fill="#d2a8ff">build</tspan><tspan fill="#e6edf3">(idea) {</tspan></text><text x="28" y="209" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:2.74s"><tspan fill="#ff7b72">    while </tspan><tspan fill="#e6edf3">(!idea.shipped) { </tspan><tspan fill="#d2a8ff">code</tspan><tspan fill="#e6edf3">(); </tspan><tspan fill="#d2a8ff">debug</tspan><tspan fill="#e6edf3">(); </tspan><tspan fill="#d2a8ff">coffee</tspan><tspan fill="#e6edf3">(); }  </tspan><tspan fill="#7d8590">// infinite loop, by design</tspan></text><text x="28" y="230" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:3.06s"><tspan fill="#ff7b72">    return </tspan><tspan fill="#d2a8ff">deploy</tspan><tspan fill="#e6edf3">(idea);  </tspan><tspan fill="#7d8590">// works on my machine, and on Render</tspan></text><text x="28" y="251" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:3.38s"><tspan fill="#e6edf3">  }</tspan></text><text x="28" y="272" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:3.70s"><tspan fill="#ff7b72">  get </tspan><tspan fill="#d2a8ff">hobbies</tspan><tspan fill="#e6edf3">() { </tspan><tspan fill="#ff7b72">return </tspan><tspan fill="#a5d6ff">[&#x27;photography&#x27;, &#x27;cinematography&#x27;, &#x27;game QA&#x27;]</tspan><tspan fill="#e6edf3">; }</tspan></text><text x="28" y="293" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:4.02s"><tspan fill="#e6edf3">}</tspan></text><text x="28" y="314" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:4.34s"><tspan fill="#7ee787">~/dibya</tspan><tspan fill="#7d8590"> $ </tspan><tspan fill="#e6edf3">git status</tspan></text><text x="28" y="335" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:4.66s"><tspan fill="#e6edf3">On branch </tspan><tspan fill="#7ee787">main</tspan><tspan fill="#7d8590">: 99 problems, but a segfault ain&#x27;t one</tspan></text><text x="28" y="356" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:4.98s"><tspan fill="#7ee787">~/dibya</tspan><tspan fill="#7d8590"> $ </tspan><tspan fill="#e6edf3">./hire --me</tspan></text><text x="28" y="377" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve" class="f" style="animation-delay:5.30s"><tspan fill="#7d8590">   # 404: sleep not found</tspan></text><rect x="28" y="386" width="8" height="15" fill="#0d9488" class="cur"/></g></svg>