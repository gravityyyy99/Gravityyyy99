  <text x="36" y="76" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l0)"><tspan fill="#34d399">~/dibya</tspan><tspan fill="#e2e8f0"> $ </tspan><tspan fill="#60a5fa">whoami</tspan></text><text x="36" y="100" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l1)"><tspan fill="#e2e8f0">&gt; Dibyajyoti Pradhan</tspan><tspan fill="#64748b"> // aka Dibya, aka gravityyyy99</tspan></text><text x="36" y="124" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l2)"><tspan fill="#34d399">~/dibya</tspan><tspan fill="#e2e8f0"> $ </tspan><tspan fill="#60a5fa">cat about.js</tspan></text><text x="36" y="148" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l3)"><tspan fill="#c084fc">class </tspan><tspan fill="#22d3ee">Dibya </tspan><tspan fill="#c084fc">extends </tspan><tspan fill="#22d3ee">Engineer </tspan><tspan fill="#e2e8f0">{</tspan></text><text x="36" y="172" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l4)"><tspan fill="#f472b6">  stack</tspan><tspan fill="#e2e8f0"> = [</tspan><tspan fill="#34d399">'React'</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#34d399">'MongoDB'</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#34d399">'SQL'</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#34d399">'Firebase'</tspan><tspan fill="#e2e8f0">];</tspan></text><text x="36" y="196" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l5)"><tspan fill="#f472b6">  bugs</tspan><tspan fill="#e2e8f0"> = [];  </tspan><tspan fill="#64748b">// O(n) in the morning, O(n log n) after coffee</tspan></text><text x="36" y="220" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l6)"><tspan fill="#c084fc">  async </tspan><tspan fill="#60a5fa">build</tspan><tspan fill="#e2e8f0">(idea) {</tspan></text><text x="36" y="244" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l7)"><tspan fill="#c084fc">    while </tspan><tspan fill="#e2e8f0">(!idea.shipped) { </tspan><tspan fill="#60a5fa">code</tspan><tspan fill="#e2e8f0">(); </tspan><tspan fill="#60a5fa">debug</tspan><tspan fill="#e2e8f0">(); </tspan><tspan fill="#60a5fa">coffee</tspan><tspan fill="#e2e8f0">(); }  </tspan><tspan fill="#64748b">// infinite loop, by design</tspan></text><text x="36" y="268" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l8)"><tspan fill="#c084fc">    return </tspan><tspan fill="#60a5fa">deploy</tspan><tspan fill="#e2e8f0">(idea);  </tspan><tspan fill="#64748b">// works on my machine, and on Render</tspan></text><text x="36" y="292" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l9)"><tspan fill="#e2e8f0">  }</tspan></text><text x="36" y="316" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l10)"><tspan fill="#c084fc">  get </tspan><tspan fill="#60a5fa">hobbies</tspan><tspan fill="#e2e8f0">() { </tspan><tspan fill="#c084fc">return </tspan><tspan fill="#34d399">['photography', 'cinematography', 'game QA']</tspan><tspan fill="#e2e8f0">; }</tspan></text><text x="36" y="340" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l11)"><tspan fill="#e2e8f0">}</tspan></text><text x="36" y="364" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l12)"><tspan fill="#34d399">~/dibya</tspan><tspan fill="#e2e8f0"> $ </tspan><tspan fill="#60a5fa">git status</tspan></text><text x="36" y="388" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l13)"><tspan fill="#e2e8f0">On branch </tspan><tspan fill="#34d399">main</tspan><tspan fill="#64748b">: 99 problems, but a segfault ain't one</tspan></text><text x="36" y="412" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve" clip-path="url(#l14)"><tspan fill="#34d399">~/dibya</tspan><tspan fill="#e2e8f0"> $ </tspan><tspan fill="#60a5fa">./hire --me</tspan><tspan fill="#64748b">   # 404: sleep not found</tspan></text>
